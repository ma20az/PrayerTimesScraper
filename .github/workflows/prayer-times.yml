name: Prayer Times Extraction
on:
  schedule:
    # Daily at 08:30 UTC (about 3:30-4:30 AM in Waterloo). The masjid page only shows ~7 days, so a WEEKLY run
    # leaves a gap (the website would have no row for the last day of each week). Daily keeps latest.json current.
    - cron: '30 8 * * *'
  workflow_dispatch: # Allows manual triggering
permissions:
  contents: write # lets the job commit prayer_times/latest.json with the built-in token

jobs:
  extract-prayer-times:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm install puppeteer csv-writer
        
      - name: Test the parser
        run: node --test test/*.test.js

      - name: Run prayer times extraction
        run: node extract-prayer-times.js
        
      - name: Commit and push CSV files
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add prayer_times/latest.json prayer_times/*.csv prayer_times/*.png
          git commit -m "Update prayer times for $(date +'%B %Y')" || echo "No changes to commit"
          git push https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
